<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GREEN-API Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="app-card">
      <div class="form-panel">
        <h1>GREEN-API Test</h1>

        <div class="field-group">
          <label for="idInstance">idInstance</label>
          <input id="idInstance" type="text" placeholder="1101000001" autocomplete="off">
        </div>

        <div class="field-group">
          <label for="apiTokenInstance">ApiTokenInstance</label>
          <input id="apiTokenInstance" type="password" placeholder="Введите токен инстанса" autocomplete="off">
        </div>

        <div class="button-group">
          <button id="getSettingsButton" type="button">getSettings</button>
          <button id="getStateInstanceButton" type="button">getStateInstance</button>
        </div>

        <div class="section-title">sendMessage</div>

        <div class="field-group">
          <label for="chatIdMessage">Номер телефона</label>
          <input id="chatIdMessage" type="tel" placeholder="77771234567" autocomplete="off">
        </div>

        <div class="field-group">
          <label for="message">Текст сообщения</label>
          <textarea id="message" placeholder="Hello Green API"></textarea>
        </div>

        <button id="sendMessageButton" type="button">sendMessage</button>

        <div class="section-title">sendFileByUrl</div>

        <div class="field-group">
          <label for="chatIdFile">Номер телефона</label>
          <input id="chatIdFile" type="tel" placeholder="77771234567" autocomplete="off">
        </div>

        <div class="field-group">
          <label for="fileUrl">URL файла</label>
          <input id="fileUrl" type="url" placeholder="https://example.com/file.png" autocomplete="off">
        </div>

        <button id="sendFileButton" type="button">sendFileByUrl</button>
      </div>

      <div class="response-panel">
        <label for="responseOutput">Ответ</label>
        <textarea
          id="responseOutput"
          readonly
          placeholder="Здесь появится JSON-ответ GREEN-API"
        ></textarea>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
